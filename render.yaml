services:
  - type: web
    name: chicken-shop-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SHOP_NAME
        value: Reddy Chicken and Mutton Center
      - key: SHOP_PHONE
        value: "7989856610"
      - key: SHOP_ADDRESS
        value: old alwal secenderabad
      - key: CURRENCY_SYMBOL
        value: ₹
      - key: TIMEZONE
        value: Asia/Kolkata
